services:
  postgres:
    image: postgres:16-alpine
    container_name: foodmarket-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodmarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodmarket-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - foodmarket
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: foodmarket-api
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - foodmarket

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: foodmarket-worker
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - api
      - redis
    networks:
      - foodmarket

  customer:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: customer
    container_name: foodmarket-customer
    restart: always
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    networks:
      - foodmarket

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: admin
    container_name: foodmarket-admin
    restart: always
    env_file: .env
    networks:
      - foodmarket

  restaurant:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: restaurant
    container_name: foodmarket-restaurant
    restart: always
    env_file: .env
    networks:
      - foodmarket

  business:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: business
    container_name: foodmarket-business
    restart: always
    env_file: .env
    networks:
      - foodmarket

  courier:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: courier
    container_name: foodmarket-courier
    restart: always
    env_file: .env
    networks:
      - foodmarket

  nginx:
    image: nginx:1.27-alpine
    container_name: foodmarket-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - api
      - customer
      - admin
      - restaurant
      - business
      - courier
    networks:
      - foodmarket

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  foodmarket:
    driver: bridge
