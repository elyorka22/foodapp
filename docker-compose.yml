# Backend droplet: API + PostgreSQL + Redis
# Usage: docker compose build --no-cache && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: foodmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodmarket_secret}
      POSTGRES_DB: ${POSTGRES_DB:-foodmarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodmarket}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodmarket-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      ignore: infrastructure/docker/backend.dockerignore
    container_name: foodmarket-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodmarket}:${POSTGRES_PASSWORD:-foodmarket_secret}@postgres:5432/${POSTGRES_DB:-foodmarket}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/api/v1/health/live',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  backend:
    driver: bridge
