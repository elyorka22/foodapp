# FRONTEND DROPLET — Next.js apps + Nginx
services:
  customer:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: customer
        APP_PORT: 3000
    restart: always
    env_file: .env
    environment:
      PORT: 3000
    networks:
      - frontend

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: admin
        APP_PORT: 3001
    restart: always
    env_file: .env
    environment:
      PORT: 3001
    networks:
      - frontend

  restaurant:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: restaurant
        APP_PORT: 3002
    restart: always
    env_file: .env
    environment:
      PORT: 3002
    networks:
      - frontend

  business:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: business
        APP_PORT: 3003
    restart: always
    env_file: .env
    environment:
      PORT: 3003
    networks:
      - frontend

  courier:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.next
      args:
        APP_NAME: courier
        APP_PORT: 3004
    restart: always
    env_file: .env
    environment:
      PORT: 3004
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - customer
      - admin
      - restaurant
      - business
      - courier
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
