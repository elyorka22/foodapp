# FRONTEND DROPLET — Next.js + Nginx only
# Deploy: docker compose -f docker-compose.frontend.yml build --no-cache web && docker compose -f docker-compose.frontend.yml up -d

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      ignore: infrastructure/docker/frontend.dockerignore
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://foodapp.uz}
    container_name: foodapp-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: foodapp-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
