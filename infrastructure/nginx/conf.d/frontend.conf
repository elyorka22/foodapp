# Frontend droplet — proxy to Next apps; API on separate backend host
upstream customer_app { server customer:3000; }
upstream admin_app { server admin:3001; }
upstream restaurant_app { server restaurant:3002; }
upstream business_app { server business:3003; }
upstream courier_app { server courier:3004; }

server {
    listen 80;
    server_name foodmarket.uz www.foodmarket.uz;

    location /_next/static/ {
        proxy_pass http://customer_app;
        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://customer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name admin.foodmarket.uz;
    location / {
        proxy_pass http://admin_app;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name restaurant.foodmarket.uz;
    location / {
        proxy_pass http://restaurant_app;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name business.foodmarket.uz shop.foodmarket.uz;
    location / {
        proxy_pass http://business_app;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name courier.foodmarket.uz;
    location / {
        proxy_pass http://courier_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
