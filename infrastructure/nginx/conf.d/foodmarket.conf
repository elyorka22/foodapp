        proxy_pass http://web_app;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name business.foodmarket.local shop.foodmarket.local;

    location / {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name courier.foodmarket.local;

    location / {
        proxy_pass http://web_app;
