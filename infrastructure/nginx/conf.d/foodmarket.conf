upstream api_backend {
    server api:4000;
    keepalive 32;
}

upstream customer_app {
    server customer:3000;
}

upstream admin_app {
    server admin:3001;
}

upstream restaurant_app {
    server restaurant:3002;
}

upstream business_app {
    server business:3003;
}

upstream courier_app {
    server courier:3004;
}

# API Gateway
server {
    listen 80;
    server_name api.foodmarket.local api.*;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# Customer app
server {
    listen 80;
    server_name foodmarket.local www.foodmarket.local;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://customer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin panel
server {
    listen 80;
    server_name admin.foodmarket.local;

    location / {
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Restaurant panel
server {
    listen 80;
    server_name restaurant.foodmarket.local partner.foodmarket.local;

    location / {
        proxy_pass http://restaurant_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Business panel (grocery / flowers / local shops)
server {
    listen 80;
    server_name business.foodmarket.local shop.foodmarket.local;

    location / {
        proxy_pass http://business_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Courier panel
server {
    listen 80;
    server_name courier.foodmarket.local driver.foodmarket.local;

    location / {
        proxy_pass http://courier_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
